name: Ruff, offline tests and MCP compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check

      - name: Check lint
        run: uv run ruff check

  offline-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mcp: ['1.29.0', '2.2.0']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e '.[dev,figures]' 'mcp==${{ matrix.mcp }}'

      - name: Run offline tests
        run: python -m pytest -q -ra
